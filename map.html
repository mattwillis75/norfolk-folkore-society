<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folklore Map - The Norfolk Folklore Society</title>
    <meta name="description" content="Explore an interactive map of the myths, legends, and historical folklore sightings across Norfolk.">
    
    <!-- Google Fonts: Corben Regular & Sora Light -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Corben&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for standard icons (Socials, Play, Plus) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables for Colors and Fonts */
        :root {
            --primary-green: #375023; /* Dark earthy green */
            --secondary-green: #4b6b33; /* Lighter green */
            --footer-green: #a7b799; /* Sage green for footer */
            --accent-line: #889b77; /* Color for borders and lines */
            --text-light: #fdfdfd;
            --text-dark: #333333;
            --font-headings: 'Corben', serif;
            --font-body: 'Sora', sans-serif;
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-weight: 300;
            background-color: var(--primary-green);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3, h4, .nav-links a, .btn {
            font-family: var(--font-headings);
            font-weight: 400;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background-color: var(--primary-green);
            z-index: 1000;
            padding: 1.5rem 0;
            text-align: center;
            border-bottom: 2px solid var(--accent-line);
        }

        .logo-container img {
            max-width: 750px; 
            width: 95%;
            height: auto;
            margin-bottom: 1rem;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            display: inline-block;
            transition: transform 0.3s ease, color 0.3s ease;
            letter-spacing: 1px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #d1dfc1;
            transform: scale(1.05);
        }

        /* Floating 'Join Us' Roundel */
        .floating-join {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 90px;
            height: 90px;
            background-color: var(--secondary-green);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-light);
            text-decoration: none;
            font-family: var(--font-headings);
            font-size: 1.1rem;
            z-index: 1001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            line-height: 1.1;
        }

        .floating-join img {
            width: 30px;
            margin-top: 5px;
        }

        .floating-join:hover {
            transform: translateY(-50%) scale(1.1);
        }

        /* Map Section Specific Styles */
        .map-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem 4rem 2rem;
            text-align: center;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 3rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .section-title h2 {
            line-height: 1; 
            margin: 0;
        }

        .section-title img {
            height: 2rem;
            width: auto;
            position: relative;
            top: 6px; 
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 70vh; /* Responsive height */
            min-height: 500px;
            border: 4px solid var(--accent-line);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            background-color: #e5e3df; /* Map background fallback */
        }

        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .map-description {
            margin-top: 2rem;
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Footer */
        footer {
            background-color: var(--footer-green);
            color: var(--primary-green);
            padding: 3rem 2rem;
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .footer-left {
            display: flex;
            gap: 1rem;
            flex: 1;
        }

        .social-icons a {
            background-color: white;
            color: var(--footer-green);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .social-icons a:hover {
            transform: scale(1.1);
        }

        .footer-center {
            text-align: center;
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem; 
        }

        .footer-center h2 {
            font-size: 2.2rem;
            margin: 0; 
            letter-spacing: 1px;
            line-height: 1;
        }

        .footer-center p {
            font-size: 1.2rem;
            margin: 0 0 0.5rem 0; 
        }

        .btn-signup {
            background-color: var(--primary-green);
            color: var(--text-light);
            padding: 0.75rem 2rem;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1.1rem;
            display: inline-block;
            transition: transform 0.3s ease, background-color 0.3s ease;
            white-space: nowrap;
        }

        .btn-signup:hover {
            transform: scale(1.05);
            background-color: #2b3d1b;
        }

        .footer-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .footer-placeholder-circle {
            width: 100px;
            height: 100px;
            background-color: var(--primary-green);
            border-radius: 50%;
        }

        /* Animation Classes */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .animate-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .slide-in-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .slide-in-left.is-visible {
            opacity: 1;
            transform: translateX(0);
        }

        .slide-in-right {
            opacity: 0;
            transform: translateX(50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .slide-in-right.is-visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .map-container {
                height: 50vh;
            }
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
            .footer-left {
                justify-content: center;
            }
            .footer-right {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="images/norfolk-folklore-society-logo-main.png" alt="Norfolk Folklore Society" loading="lazy">
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <!-- Note: The 'active' class is now on the MAP link -->
                <li><a href="index.html">HOME</a></li>
                <li><a href="stories.html">STORIES</a></li>
                <li><a href="map.html" class="active">MAP</a></li>
                <li><a href="shop.html">SHOP</a></li>
                <li><a href="podcast.html">PODCAST</a></li>
                <li><a href="contact.html">CONTACT US</a></li>
            </ul>
        </nav>
    </header>

    <!-- Floating Join Us Roundel -->
    <a href="https://norfolkfolkloresociety.substack.com/" class="floating-join">
        JOIN<br>US
        <img src="images/tailpiece.svg" alt="decoration" loading="lazy">
    </a>

    <main>
        <!-- Map Section -->
        <section class="map-section animate-on-scroll">
            <div class="section-title">
                <img src="images/header-decoration-left.svg" alt="Left Decoration" class="slide-in-left" loading="lazy">
                <h2>FOLKLORE MAP</h2>
                <img src="images/header-decoration-right.svg" alt="Right Decoration" class="slide-in-right" loading="lazy">
            </div>
            
            <div class="map-container">
                <!-- Google My Maps Embed (viewer replaced with embed in URL) -->
                <iframe src="https://www.google.com/maps/d/embed?mid=1E87YCw5PMWmJswTTs0VwCSa3ki9_h8k&ehbc=2D3142" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <p class="map-description">
                Explore the myths, legends, and historical sightings across Norfolk. Click on any pin on the map to uncover the stories attached to that location.
            </p>
        </section>
    </main>

    <!-- Footer -->
    <footer class="animate-on-scroll">
        <div class="footer-content">
            <!-- Left Side: Social Media -->
            <div class="footer-left social-icons">
                <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://spotify.com" target="_blank" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
            </div>

            <!-- Center: Sign up Form -->
            <div class="footer-center">
                <h2>JOIN US</h2>
                <p>Sign up to our Substack newsletter</p>
                <a href="https://norfolkfolkloresociety.substack.com/" class="btn-signup">Sign Up Here</a>
            </div>

            <!-- Right Side: Dark Green Circle Placeholder -->
            <div class="footer-right">
                <div class="footer-placeholder-circle"></div>
            </div>
        </div>
    </footer>

    <!-- JavaScript for Animations -->
    <script>
        // Scroll Animation Logic
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-on-scroll, .slide-in-left, .slide-in-right').forEach(element => {
            observer.observe(element);
        });
    </script>
</body>
</html>
