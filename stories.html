<!-- JavaScript -->
<script>
    // Set up the Scroll Observer for animations
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.15
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    // Observe initial static elements
    document.querySelectorAll('.animate-on-scroll, .slide-in-left, .slide-in-right').forEach(element => {
        observer.observe(element);
    });

    // Local JSON Fetch Logic with Pagination
    const featuredGrid = document.getElementById('featured-stories-grid');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const initialLoading = document.getElementById('initial-loading');
    
    let currentOffset = 0;
    const storiesPerLoad = 9;
    let allStories = []; // We will store the full archive here once loaded
    
    function renderStories() {
        // Slice out the next 9 stories from our local array
        const storiesToRender = allStories.slice(currentOffset, currentOffset + storiesPerLoad);
        
        storiesToRender.forEach(item => {
            const dateObj = new Date(item.post_date);
            const formattedDate = dateObj.toLocaleDateString('en-US', { 
                month: 'short', day: 'numeric', year: 'numeric' 
            });

            // Fallback image in case a specific post lacks a cover image
            const imageUrl = item.cover_image || 'images/norfolk-folklore-society-logo-main.png'; 
            
            let textContent = item.description || "";
            const excerpt = textContent.length > 120 
                ? textContent.substring(0, 120).trim() + "..." 
                : textContent;

            let author = "Ada Nemesis";
            if (item.authors && item.authors.length > 0) {
                author = item.authors[0].name;
            }

            // Build the card HTML
            const card = document.createElement('a');
            card.href = item.canonical_url;
            card.className = "story-card animate-on-scroll";
            card.target = "_blank";
            card.innerHTML = `
                <img src="${imageUrl}" alt="${item.title}" class="hero-img" loading="lazy">
                <div class="story-content">
                    <h3>${item.title}</h3>
                    <p class="author-date">by <strong>${author}</strong><br>${formattedDate}</p>
                    <p class="excerpt">${excerpt}</p>
                </div>
            `;
            
            // Append card to grid and observe it so it animates in properly
            featuredGrid.appendChild(card);
            // Small delay so the browser registers it before animating
            setTimeout(() => observer.observe(card), 50); 
        });

        currentOffset += storiesPerLoad;

        // Hide the button if we've reached the end of the archive
        if (currentOffset >= allStories.length) {
            loadMoreBtn.style.display = 'none';
        } else {
            loadMoreBtn.innerText = 'Load More Stories';
            loadMoreBtn.disabled = false;
            loadMoreBtn.style.opacity = '1';
        }
    }

    function initArchive() {
        // Change button text to indicate loading state
        const originalBtnText = loadMoreBtn.innerText;
        loadMoreBtn.innerText = 'Summoning...';
        loadMoreBtn.disabled = true;
        loadMoreBtn.style.opacity = '0.7';

        // Fetch the local JSON file
        fetch('archive.json')
            .then(response => {
                if (!response.ok) throw new Error("Could not find archive.json");
                return response.json();
            })
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    allStories = data; // Store the whole archive in memory
                    
                    if (initialLoading) {
                        initialLoading.remove(); 
                        loadMoreBtn.style.display = 'inline-block';
                    }
                    
                    renderStories(); // Render the first batch
                } else {
                    featuredGrid.innerHTML = '<p class="loading-message">The archive is empty.</p>';
                    loadMoreBtn.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Error fetching local JSON:', error);
                featuredGrid.innerHTML = '<p class="loading-message">Cannot find the archive.json file. Make sure it is saved in the same folder as this page.</p>';
                loadMoreBtn.style.display = 'none';
            });
    }

    // Load the JSON automatically when the page loads
    document.addEventListener("DOMContentLoaded", initArchive);
    
    // Render the next batch when the button is clicked
    loadMoreBtn.addEventListener('click', () => {
        loadMoreBtn.innerText = 'Summoning...';
        loadMoreBtn.disabled = true;
        loadMoreBtn.style.opacity = '0.7';
        
        // Slight timeout for visual feedback
        setTimeout(renderStories, 300);
    });
</script>
