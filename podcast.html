<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast | The Norfolk Folklore Society</title>
    <meta name="description" content="Listen to The Norfolk Folklore Society podcast. Tales of Black Shuck, witchcraft, and fenland myths.">
    
    <!-- Google Fonts: Corben Regular & Sora Light -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Corben&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables */
        :root {
            --primary-green: #375023;
            --secondary-green: #4b6b33;
            --footer-green: #a7b799;
            --accent-line: #889b77;
            --text-light: #fdfdfd;
            --text-dark: #333333;
            --font-headings: 'Corben', serif;
            --font-body: 'Sora', sans-serif;
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-weight: 300;
            background-color: var(--primary-green);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3, h4, .nav-links a, .btn {
            font-family: var(--font-headings);
            font-weight: 400;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background-color: var(--primary-green);
            z-index: 1000;
            padding: 1.5rem 0;
            text-align: center;
            border-bottom: 2px solid var(--accent-line);
        }

        .logo-container img {
            max-width: 750px; 
            width: 95%;
            height: auto;
            margin-bottom: 1rem;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            display: inline-block;
            transition: transform 0.3s ease, color 0.3s ease;
            letter-spacing: 1px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #d1dfc1;
            transform: scale(1.05);
        }

        /* Floating Join Us */
        .floating-join {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 90px;
            height: 90px;
            background-color: var(--secondary-green);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-light);
            text-decoration: none;
            font-family: var(--font-headings);
            font-size: 1.1rem;
            z-index: 1001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            line-height: 1.1;
        }

        .floating-join img {
            width: 30px;
            margin-top: 5px;
        }

        .floating-join:hover {
            transform: translateY(-50%) scale(1.1);
        }

        /* Main Layout */
        .section-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem 4rem;
            text-align: center;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .section-title h2 {
            line-height: 1; 
            margin: 0;
            text-transform: uppercase;
        }

        .section-title img {
            height: 2rem;
            width: auto;
            position: relative;
            top: 6px; 
        }

        .intro-text {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto 3rem auto;
            color: #e0e0e0;
        }

        /* Podcast Grid (Matches Stories Grid) */
        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .story-card {
            background-color: white;
            color: var(--text-dark);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: left;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .story-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7); 
        }

        .story-card img.hero-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .story-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .story-content h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--primary-green);
        }
        
        .story-content .author-date {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 1rem;
            font-family: var(--font-body);
        }

        .story-content p.excerpt {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        /* Listen Button */
        .btn-listen {
            background-color: #1DB954; /* Spotify Green */
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.3s ease;
            font-family: var(--font-body);
            font-weight: 600;
            align-self: flex-start;
        }

        .btn-listen:hover {
            background-color: #1aa34a;
        }

        .loading-message {
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: var(--text-light);
            padding: 2rem;
        }

        /* Footer */
        footer {
            background-color: var(--footer-green);
            color: var(--primary-green);
            padding: 3rem 2rem;
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .footer-left {
            display: flex;
            gap: 1rem;
            flex: 1;
        }

        .social-icons a {
            background-color: white;
            color: var(--footer-green);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .social-icons a:hover {
            transform: scale(1.1);
        }

        .footer-center {
            text-align: center;
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem; 
        }

        .footer-center h2 {
            font-size: 2.2rem;
            margin: 0; 
            letter-spacing: 1px;
            line-height: 1;
        }

        .footer-center p {
            font-size: 1.2rem;
            margin: 0 0 0.5rem 0; 
        }

        .btn-signup {
            background-color: var(--primary-green);
            color: var(--text-light);
            padding: 0.75rem 2rem;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1.1rem;
            display: inline-block;
            transition: transform 0.3s ease, background-color 0.3s ease;
            white-space: nowrap;
            border: 2px solid var(--accent-line);
        }

        .btn-signup:hover {
            transform: scale(1.05);
            background-color: #2b3d1b;
        }

        .footer-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .footer-placeholder-circle {
            width: 100px;
            height: 100px;
            background-color: var(--primary-green);
            border-radius: 50%;
        }

        /* Animations */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .animate-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .slide-in-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .slide-in-left.is-visible {
            opacity: 1;
            transform: translateX(0);
        }

        .slide-in-right {
            opacity: 0;
            transform: translateX(50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .slide-in-right.is-visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
            .footer-left {
                justify-content: center;
            }
            .footer-right {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="images/norfolk-folklore-society-logo-main.png" alt="Norfolk Folklore Society" loading="lazy">
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="stories.html">STORIES</a></li>
                <li><a href="map.html">MAP</a></li>
                <li><a href="shop.html">SHOP</a></li>
                <li><a href="podcast.html" class="active">PODCAST</a></li>
                <li><a href="news.html" >NEWS</a></li>
                <li><a href="contact.html">CONTACT US</a></li>
            </ul>
        </nav>
    </header>

    <!-- Floating Join Us Roundel -->
    <a href="https://norfolkfolkloresociety.substack.com/" class="floating-join">
        JOIN<br>US
        <img src="images/tailpiece.svg" alt="decoration" loading="lazy">
    </a>

    <main>
        <!-- Podcast Archive Section -->
        <section class="section-container animate-on-scroll">
            <div class="section-title">
                <img src="images/header-decoration-left.svg" alt="Left Decoration" class="slide-in-left" loading="lazy">
                <h2>THE PODCAST</h2>
                <img src="images/header-decoration-right.svg" alt="Right Decoration" class="slide-in-right" loading="lazy">
            </div>
            
            <p class="intro-text animate-on-scroll">Join us as we traverse the marshes, woods, and ancient ruins of the county. Listen to our archived episodes below.</p>
            
            <!-- Where the JavaScript injects the cards -->
            <div class="stories-grid" id="podcast-grid">
                <p class="loading-message">Tuning into the archive...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="animate-on-scroll">
        <div class="footer-content">
            <div class="footer-left social-icons">
                <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://spotify.com" target="_blank" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
            </div>

            <div class="footer-center">
                <h2>JOIN US</h2>
                <p>Sign up to our Substack newsletter</p>
                <a href="https://norfolkfolkloresociety.substack.com/" class="btn-signup">Sign Up Here</a>
            </div>

            <div class="footer-right">
                <div class="footer-placeholder-circle"></div>
            </div>
        </div>
    </footer>

    <!-- Include the local podcast.js data file -->
    <script src="podcast.js"></script>

    <!-- JavaScript for Animations & Grid Generation -->
    <script>
        // Scroll Animations
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-on-scroll, .slide-in-left, .slide-in-right').forEach(element => {
            observer.observe(element);
        });

        // Load Podcasts from podcast.js
        document.addEventListener("DOMContentLoaded", function() {
            const podcastGrid = document.getElementById('podcast-grid');
            
            // Check if the podcastArchive array loaded successfully
            if (typeof podcastArchive !== 'undefined' && podcastArchive.length > 0) {
                podcastGrid.innerHTML = ''; // Clear loading message
                
                podcastArchive.forEach(episode => {
                    // Format the date nicely
                    const dateObj = new Date(episode.publish_date);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { 
                        month: 'short', 
                        day: 'numeric', 
                        year: 'numeric' 
                    });

                    // Build the card
                    const card = document.createElement('div');
                    card.className = "story-card animate-on-scroll";
                    card.innerHTML = `
                        <img src="${episode.image}" alt="${episode.title}" class="hero-img" loading="lazy">
                        <div class="story-content">
                            <h3>${episode.title}</h3>
                            <p class="author-date">${formattedDate}</p>
                            <p class="excerpt">${episode.description}</p>
                            <a href="${episode.spotify_link}" target="_blank" class="btn-listen">
                                <i class="fa-brands fa-spotify"></i> Listen on Spotify
                            </a>
                        </div>
                    `;
                    
                    podcastGrid.appendChild(card);
                    // Add slight delay for the scroll animation observer to catch it
                    setTimeout(() => observer.observe(card), 50); 
                });
            } else {
                podcastGrid.innerHTML = '<p class="loading-message" style="color: #ffcccc;">Cannot find the archive data. Make sure <strong>podcast.js</strong> is saved in the exact same folder as this page.</p>';
            }
        });
    </script>
</body>
</html>
